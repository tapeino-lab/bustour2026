<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#36b6ec" />
    <title>やまなしバスタワー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="sound" class="sound">
        <button id="bgm-toggle" class="toggle hidden" aria-pressed="false">BGM</button>
        <button id="sfx-toggle" class="toggle" aria-pressed="false">おと</button>
      </div>
      <button id="rotate" class="comic-btn" aria-label="かいてん">
        <svg viewBox="0 -2 34 34" aria-hidden="true">
          <path d="M27 16 A11 11 0 1 1 15 5" fill="none" stroke="#111" stroke-width="4.5" stroke-linecap="round" />
          <path d="M13 -1 L24 5 L13 11 Z" fill="#111" stroke="#111" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
        <span>かいてん</span>
      </button>
      <section id="over" class="overlay hidden">
        <div class="panel result-panel">
          <p class="result"><b id="over-score">0</b> こ</p>
          <p class="result">たかさ <b id="over-height">0.0</b> m</p>
          <button id="my-tower" class="my-tower hidden" aria-label="こんかいの タワーを みる">
            <canvas id="my-tower-canvas"></canvas>
            <span class="chip">みる</span>
          </button>
          <p class="best">じこベスト <span id="over-best">0</span>こ　<span id="over-best-height">0.0</span>m</p>
          <p class="newbest hidden" id="new-best">じこベスト こうしん！</p>
        </div>
        <div id="ranking" class="panel ranking hidden">
          <div class="columns">
            <div>
              <h4>たかさ</h4>
              <ol id="ranking-height"></ol>
            </div>
            <div>
              <h4>こすう</h4>
              <ol id="ranking-count"></ol>
            </div>
          </div>
          <button id="rename" class="comic-btn sub rename hidden">なまえを かえる</button>
        </div>
        <button id="retry" class="comic-btn">もういちど</button>
        <button id="open-join" class="comic-btn sub hidden">さんかコードを いれる</button>
      </section>
      <section id="join" class="overlay hidden">
        <div class="panel join">
          <h3>さんかコード</h3>
          <input id="join-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="すうじ" autocomplete="off" autocorrect="off" spellcheck="false" />
          <p id="join-error" class="error hidden">コードが ちがうよ</p>
          <div class="row">
            <button id="join-ok" class="comic-btn">はいる</button>
            <button id="join-later" class="comic-btn sub">あとで</button>
          </div>
        </div>
      </section>
      <section id="tower" class="overlay hidden">
        <div class="panel viewer">
          <h3 id="tower-title"></h3>
          <canvas id="tower-canvas"></canvas>
          <button id="tower-close" class="comic-btn sub">とじる</button>
        </div>
      </section>
      <section id="name" class="overlay hidden">
        <div class="panel namepad">
          <h3>なまえを おしえて</h3>
          <p class="name-hint">ひらがな 3もじまで</p>
          <div class="name-row">
            <div id="name-boxes" class="name-boxes"><span></span><span></span><span></span></div>
            <button id="name-del" class="name-del" type="button">けす</button>
          </div>
          <div id="kana-keys" class="kana-keys"></div>
          <p id="name-error" class="error hidden">1もじ いじょう いれてね</p>
          <div class="row">
            <button id="name-skip" class="comic-btn sub">のせない</button>
            <button id="name-ok" class="comic-btn sub ok">けってい</button>
          </div>
        </div>
      </section>
      <section id="admin" class="overlay hidden">
        <div class="panel admin">
          <h3>かお とうろく</h3>
          <p class="small">この たんまつの ID: <code id="admin-uid"></code></p>
          <p id="admin-status" class="small"></p>
          <ul id="admin-list"></ul>
          <div id="admin-bgm" class="admin-bgm hidden">
            <span>BGM（mp3、700KBまで）</span>
            <label class="chip">ファイル<input id="admin-bgm-file" type="file" accept="audio/*" /></label>
            <span id="admin-bgm-status" class="small"></span>
          </div>
          <button id="admin-close" class="comic-btn sub">とじる</button>
        </div>
      </section>
      <div id="version"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
