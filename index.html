<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6ec3f0" />
    <title>やまなしバスタワー</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <button id="rotate" aria-label="かいてん">↻ かいてん</button>
      <section id="over" class="overlay hidden">
        <h2>おちちゃった！</h2>
        <p class="result"><b id="over-score">0</b> こ つめた</p>
        <p class="best" id="over-best-line">じこベスト <b id="over-best">0</b> こ</p>
        <p class="newbest hidden" id="new-best">じこベスト こうしん！</p>
        <button id="retry" class="primary">もういちど</button>
      </section>
      <div id="version"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
